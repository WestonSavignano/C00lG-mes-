name: Issue 19 deterministic patch

on:
  push:
    branches:
      - 'feature/issue-19-host-authority-poc'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/issue-19-host-authority-poc
      - name: Apply verified source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}')
              file.write_text(text.replace(old, new))

          replace(
              'src/networking/poc/hostAuthorityModel.ts',
              """function isHostMember(value: unknown): value is HostAuthorityMember {
            return isCanonicalMember(value)
              && isPocIdentity(value.credentialId)
              && isCredentialVerifier(value.credentialVerifier)
              && isNonNegativeInteger(value.lastClientSequence)
          }
          """,
              """function isHostMember(value: unknown): value is HostAuthorityMember {
            return isRecord(value)
              && isPocIdentity(value.memberId)
              && typeof value.label === 'string'
              && value.label.length > 0
              && value.label.length <= 64
              && typeof value.removed === 'boolean'
              && isPocIdentity(value.credentialId)
              && isCredentialVerifier(value.credentialVerifier)
              && isNonNegativeInteger(value.lastClientSequence)
          }
          """,
          )

          replace(
              'src/pages/HostAuthorityPocPage.tsx',
              "import { FormEvent, useCallback, useEffect, useMemo, useRef, useState } from 'react'",
              "import { useCallback, useEffect, useMemo, useRef, useState } from 'react'\nimport type { FormEvent } from 'react'",
          )
          replace(
              'src/pages/HostAuthorityPocPage.tsx',
              "  const [chatDraft, setChatDraft] = useState('')\n",
              "  const [chatDraft, setChatDraft] = useState('')\n  const [guestCredentialView, setGuestCredentialView] = useState<{ credentialId: string; nextClientSequence: number } | null>(null)\n  const [canReplayGuestIntent, setCanReplayGuestIntent] = useState(false)\n",
          )
          replace(
              'src/pages/HostAuthorityPocPage.tsx',
              """    saveGuestAuthority(localStorage, nextCredentials)
              guestCredentialsRef.current = nextCredentials
              guestReplicaRef.current = nextReplica
          """,
              """    saveGuestAuthority(localStorage, nextCredentials)
              guestCredentialsRef.current = nextCredentials
              setGuestCredentialView({
                credentialId: nextCredentials.credentialId,
                nextClientSequence: nextCredentials.nextClientSequence,
              })
              guestReplicaRef.current = nextReplica
          """,
          )
          replace(
              'src/pages/HostAuthorityPocPage.tsx',
              """    let action: TrysteroAction<unknown> | null = null
              let hostStore: IndexedDbHostAuthorityStore | null = null
          """,
              """    let action: TrysteroAction<unknown> | null = null
              let hostStore: IndexedDbHostAuthorityStore | null = null
              let hostMessageQueue: Promise<void> = Promise.resolve()
          """,
          )
          replace(
              'src/pages/HostAuthorityPocPage.tsx',
              """      setChatDraft('')
              setAuthorityState(null)
              setGuestReplica(null)
              guestReplicaRef.current = null
              guestCredentialsRef.current = null
              hostSessionRef.current = null
              hostPeerRef.current = null
              lastGuestIntentRef.current = null
          """,
              """      setChatDraft('')
              setAuthorityState(null)
              setGuestReplica(null)
              setGuestCredentialView(null)
              setCanReplayGuestIntent(false)
              guestReplicaRef.current = null
              guestCredentialsRef.current = null
              hostSessionRef.current = null
              hostPeerRef.current = null
              lastGuestIntentRef.current = null
          """,
          )
          replace(
              'src/pages/HostAuthorityPocPage.tsx',
              """        guestCredentialsRef.current = credentials
                  const cached = credentials.cachedReplica
          """,
              """        guestCredentialsRef.current = credentials
                  setGuestCredentialView({
                    credentialId: credentials.credentialId,
                    nextClientSequence: credentials.nextClientSequence,
                  })
                  const cached = credentials.cachedReplica
          """,
          )
          replace(
              'src/pages/HostAuthorityPocPage.tsx',
              """        if (route.role === 'host') {
                    void handleHostAuthorityMessage(data, context.peerId).catch((error) => {
                      const message = error instanceof Error ? error.message : 'Host authority handler failed'
                      addLog(`host authority error: ${message}`)
                      setRuntimeError(message)
                    })
                  } else {
          """,
              """        if (route.role === 'host') {
                    hostMessageQueue = hostMessageQueue
                      .then(() => handleHostAuthorityMessage(data, context.peerId))
                      .catch((error) => {
                        const message = error instanceof Error ? error.message : 'Host authority handler failed'
                        addLog(`host authority error: ${message}`)
                        setRuntimeError(message)
                      })
                  } else {
          """,
          )
          replace(
              'src/pages/HostAuthorityPocPage.tsx',
              """      saveGuestAuthority(localStorage, nextCredentials)
              guestCredentialsRef.current = nextCredentials
              lastGuestIntentRef.current = intent
              setChatDraft('')
          """,
              """      saveGuestAuthority(localStorage, nextCredentials)
              guestCredentialsRef.current = nextCredentials
              setGuestCredentialView({
                credentialId: nextCredentials.credentialId,
                nextClientSequence: nextCredentials.nextClientSequence,
              })
              lastGuestIntentRef.current = intent
              setCanReplayGuestIntent(true)
              setChatDraft('')
          """,
          )
          replace(
              'src/pages/HostAuthorityPocPage.tsx',
              """    saveGuestAuthority(localStorage, nextCredentials)
              guestCredentialsRef.current = nextCredentials
              guestReplicaRef.current = stale
          """,
              """    saveGuestAuthority(localStorage, nextCredentials)
              guestCredentialsRef.current = nextCredentials
              setGuestCredentialView({
                credentialId: nextCredentials.credentialId,
                nextClientSequence: nextCredentials.nextClientSequence,
              })
              guestReplicaRef.current = stale
          """,
          )
          replace(
              'src/pages/HostAuthorityPocPage.tsx',
              """      nextClientSequence: guestCredentialsRef.current?.nextClientSequence ?? null,
                    credentialId: guestCredentialsRef.current?.credentialId ?? null,
          """,
              """      nextClientSequence: guestCredentialView?.nextClientSequence ?? null,
                    credentialId: guestCredentialView?.credentialId ?? null,
          """,
          )
          replace(
              'src/pages/HostAuthorityPocPage.tsx',
              'disabled={!lastGuestIntentRef.current}',
              'disabled={!canReplayGuestIntent}',
          )
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/networking/poc/hostAuthorityModel.ts src/pages/HostAuthorityPocPage.tsx
          git diff --cached --check
          git commit -m "fix: satisfy issue 19 validation [skip ci]"
          git push origin HEAD:feature/issue-19-host-authority-poc
