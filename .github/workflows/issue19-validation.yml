name: Issue 19 temporary validation

on:
  push:
    branches:
      - 'feature/issue-19-host-authority-poc'

permissions:
  contents: read

jobs:
  issue19-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx vitest run
          src/networking/poc/hostAuthorityModel.test.ts
          src/networking/poc/hostAuthoritySession.test.ts
          src/networking/poc/guestAuthorityStorage.test.ts
          src/networking/poc/hostAuthorityHostMessage.test.ts
          src/networking/poc/hostAuthorityProtocol.test.ts
          src/pages/HostAuthorityPocPage.test.tsx

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
